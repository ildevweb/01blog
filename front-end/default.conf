server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular routing fix
    location / {
        try_files $uri /index.html;
    }

    # Optional: handle favicon and assets
    location /assets/ {
        try_files $uri =404;
    }

    location /favicon.ico {
        try_files $uri =404;
    }
}
