<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="./profile.component.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>

<app-navbar></app-navbar>

<app-profile-header
  [profileData]="profileData$ | async"
  [isMine]="mine$ | async"
  (openFollowsModal)="openFollowsModal($event)"
  (follow)="follow($event)"
  (reportUser)="openReportModal($event.id, $event.type)"
></app-profile-header>

<div class="container">
  <div class="row justify-content-center">
    <section class="col-12 col-md-8 col-lg-6">
      <div id="feed">
        <app-post-card
          *ngFor="let post of posts$ | async"
          [post]="post"
          (edit)="openEditModal($event)"
          (delete)="deletePost($event)"
          (like)="likePosts($event)"
          (comment)="openComments($event)"
          (report)="openReportModal($event.id, $event.type)"
        ></app-post-card>
      </div>
      <div class="d-grid">
        <button id="loadMoreBtn" (click)="loadMore()" *ngIf="(posts$ | async)?.length" class="btn btn-outline-primary mb-3">
          Load more
        </button>
      </div>
    </section>
  </div>
</div>

<app-comments-modal
  [comments]="(comments$ | async) ?? []"
  [commentContent]="commentData.content"
  [commentError]="commentErrorMessage$ | async"
  [isSubmitting]="isSubmittingComment"
  [hasComments]="((comments$ | async)?.length ?? 0) > 0"
  (commentContentChange)="commentData.content = $event"
  (submitComment)="submitComment()"
  (likeComment)="likeComments($event)"
  (loadMoreComments)="loadMoreComments()"
></app-comments-modal>

<app-followers-modal
  [title]="(followers$ | async)?.length ? 'Followers' : 'Following'"
  [users]="(activeUsers$ | async) ?? []"
  (goToProfile)="goToProfile($event)"
  (follow)="follow($event, false)"
></app-followers-modal>

<app-edit-post-modal
  [content]="contentUpdate"
  [imagePreview]="imagePreviewUpdate | async"
  [selectedImage]="selectedImageUpdate"
  [errorMessage]="errorMessage$ | async"
  [successMessage]="successMessage$ | async"
  (contentChange)="contentUpdate = $event"
  (imageSelected)="onImageSelected($event)"
  (update)="onUpdatePost()"
  (removeMedia)="removeMedia()"
></app-edit-post-modal>

<app-report-modal (submitReport)="submitReport($event)"></app-report-modal>
