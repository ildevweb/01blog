<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="./profile.component.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>

<app-navbar></app-navbar>

<!-- Profile Header -->
<header class="profile-header">
  <img src="../../../assets/images/banner.jpg" class="profile-banner" />

  <div class="profile-info container">
    <img src="../../../assets/images/avatar.png" class="profile-photo" />

    <div class="ms-3" *ngIf="profileData$ | async as data">
      <h2> {{ data.username }} </h2>
      <div class="d-flex gap-3 text-muted">
        <div><strong> {{ data.followers }} </strong> Followers</div>
        <div><strong> {{ data.followeds }} </strong> Following</div>

        <button class="btn btn-outline-primary ms-auto">
          Edit Profile
        </button>
      </div>
    </div>
  </div>
</header>


<div class="container">
  <div class="row justify-content-center">

    <!-- My Posts -->
    <section class="col-12 col-md-8 col-lg-6">

      <!-- Posts feed -->
      <div id="feed">

        <!-- Posts list -->
        <div *ngFor="let post of posts$ | async" class="card mb-3 shadow-sm">

          <!-- Header -->
          <div class="card-header d-flex align-items-center gap-2">
            <img
              src="../../../assets/images/avatar.png"
              alt="Avatar"
              class="avatar-sm"
            />
            <strong>{{ post.username }}</strong>
            <small class="text-muted ms-auto">
              {{ post.time }}
            </small>
          </div>

          <!-- Body -->
          <div class="card-body">
            <p *ngIf="post.content">
              {{ post.content }}
            </p>
            <img
              *ngIf="post.media"
              [src]="'http://localhost:8080/' + post.media"
              alt="Post Image"
              class="post-img rounded"
            />
          </div>

          <!-- Footer -->
          <div class="card-footer d-flex justify-content-between">
            <button
              type="button"
              class="btn btn-sm d-flex align-items-center gap-1"
              [ngClass]="post.liked ? 'btn-primary' : 'btn-outline-primary'"
              (click)="likePosts(post)"
            >
              <i
                class="bi"
                [ngClass]="post.liked ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'"
              ></i>
              <span>{{ post.count }}</span>
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="openComments(post)"
            >
              Comment
            </button>
          </div>

        </div>
      </div>

      <!-- Load more -->
      <div class="d-grid">
        <button
          id="loadMoreBtn"
          class="btn btn-outline-primary mb-3"
        >
          Load more
        </button>
      </div>

    </section>

  </div>
</div>



<!-- Comments Modal -->
<div class="modal fade" id="commentsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Comments</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <!-- Comment Form -->
        <form (ngSubmit)="submitComment()" class="mb-4">

          <div class="d-flex gap-3">
            <!-- Avatar -->
            <img src="../../../assets/images/avatar.png" class="rounded-circle" width="40" height="40"/>

            <!-- Input -->
            <div class="flex-grow-1">
              <textarea
                class="form-control"
                rows="2"
                placeholder="Write a comment..."
                [(ngModel)]="commentData.content"
                name="comment"
                required
              ></textarea>

              <div class="text-end mt-2">
                <button class="btn btn-primary btn-sm" type="submit" [disabled]="isSubmittingComment || !commentData.content.trim()">
                  Comment
                </button>
              </div>
            </div>
          </div>
          <div *ngIf="commentErrorMessage$ | async as error" class="alert alert-danger text-center mt-2">
            {{ error }}
          </div>
        </form>


        <div *ngFor="let comment of (comments$ | async)" class="d-flex gap-3 mb-3 pb-3 border-bottom">
          <img src="../../../assets/images/avatar.png" class="rounded-circle" width="40" height="40"/>

          <div class="flex-grow-1">
            <div class="d-flex align-items-center gap-2">
              <strong>{{ comment.username }}</strong>
              <small class="text-muted">
                {{ comment.time }}
              </small>
            </div>

            <p class="mb-1">
              {{ comment.content }}
            </p>

            <button
              class="btn btn-sm p-0 d-flex align-items-center gap-1"
              [ngClass]="comment.liked ? 'text-primary' : 'text-muted'"
              (click)="likeComments(comment)"
            >
              <i class="bi" [ngClass]="comment.liked ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'"></i>
              <span>{{ comment.count }}</span>
            </button>
          </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="(comments$ | async)?.length === 0" class="text-muted text-center">
          No comments yet
        </div>


      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>

    </div>
  </div>
</div>
