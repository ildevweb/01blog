<!-- home.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shareit - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="home.component.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
  <app-navbar></app-navbar>

  <main class="container my-4">
    <div class="row">
      <!-- Main Content: Create Post + Feed -->
      <div class="col-12 col-md-8">
        <!-- Create Post Section -->
        <app-create-post-form
          [content]="contentCreate"
          [imagePreview]="imagePreviewCreate"
          [selectedImage]="selectedImageCreate"
          [errorMessage]="errorMessageCreate$ | async"
          [successMessage]="successMessageCreate$ | async"
          (contentChange)="contentCreate = $event"
          (imageSelected)="onImageSelected($event, 'create')"
          (create)="onCreate()"
          (removeMedia)="removeMedia('create')"
        ></app-create-post-form>

        <!-- Feed Section -->
        <section id="feed-section" class="mt-4">
          <div id="feed">
            <div
              *ngIf="!(posts$ | async)?.length"
              class="d-flex flex-column justify-content-center align-items-center text-center text-muted my-5"
              style="filter: blur(1px);"
            >
              <i class="bi bi-info-circle fs-1 mb-2"></i>
              <span class="fs-5">No posts yet | Follow more to get posts</span>
            </div>

            <app-post-card
              *ngFor="let post of posts$ | async"
              [post]="post"
              (edit)="openEditModal($event)"
              (delete)="deletePost($event)"
              (like)="likePosts($event)"
              (comment)="openComments($event)"
              (report)="openReportModal($event.id, $event.type)"
            ></app-post-card>
          </div>

          <div *ngIf="(posts$ | async)?.length" class="d-grid mt-3">
            <button (click)="loadMore()" id="loadMoreBtn" class="btn btn-outline-primary">Load more</button>
          </div>
        </section>
      </div>

      <!-- Sidebar -->
      <div class="col-12 col-md-4">
        <app-suggested-users-sidebar
          [users]="(users$ | async) ?? []"
          (follow)="follow($event)"
          (report)="openReportModal($event.id, $event.type)"
          (goToProfile)="goToProfile($event)"
          (loadMoreUsers)="loadMoreUsers()"
        ></app-suggested-users-sidebar>
      </div>
    </div>
  </main>

  <!-- Edit Post Modal -->
  <app-edit-post-modal
    [content]="contentUpdate"
    [imagePreview]="imagePreviewUpdate | async"
    [selectedImage]="selectedImageUpdate"
    [errorMessage]="errorMessageUpdate$ | async"
    [successMessage]="successMessageUpdate$ | async"
    (contentChange)="contentUpdate = $event"
    (imageSelected)="onImageSelected($event, 'update')"
    (update)="onUpdatePost()"
    (removeMedia)="removeMedia('update')"
  ></app-edit-post-modal>

  <!-- Report Modal -->
  <app-report-modal
    (submitReport)="submitReport($event)"
  ></app-report-modal>

  <!-- Comments Modal -->
  <app-comments-modal
    [comments]="(comments$ | async) ?? []"
    [commentContent]="commentData.content"
    [commentError]="commentErrorMessage$ | async"
    [isSubmitting]="isSubmittingComment"
    [hasComments]="((comments$ | async)?.length ?? 0) > 0"
    (commentContentChange)="commentData.content = $event"
    (submitComment)="submitComment()"
    (likeComment)="likeComments($event)"
    (deleteComment)="deleteComments($event)"
    (loadMoreComments)="loadMoreComments()"
  ></app-comments-modal>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
