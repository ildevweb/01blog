<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="notification.component.css" />
</head>

<app-navbar></app-navbar>

<body class="bg-light">
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Notifications</h3>
            <button class="btn btn-primary btn-sm" (click)="markAllAsRead()">Mark All as Read</button>
        </div>

        <div class="list-group">
            <div
            *ngFor="let notif of notifications | async"
            class="list-group-item list-group-item-action d-flex align-items-start gap-3"
            [ngClass]="{ 'bg-light': !notif.readed, 'bg-white text-muted': notif.readed }"
            >
                <img src="../../../assets/images/avatar.png" class="rounded-circle flex-shrink-0" alt="Avatar" width="40" height="40">
                <div class="flex-grow-1">
                    <div>
                    <strong>{{ notif.username }}</strong> {{ notif.content }}
                    </div>
                    <div class="text-muted" style="font-size:0.8rem">{{ notif.time }}</div>
                </div>

                <div class="ms-auto">
                    <i *ngIf="!notif.readed" class="bi bi-envelope-fill text-primary"></i>
                    <i *ngIf="notif.readed" class="bi bi-envelope-open text-muted"></i>
                </div>
            </div>
        </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
