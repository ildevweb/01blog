<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
  rel="stylesheet"
/>


<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
<div class="container">
  <a class="navbar-brand fw-bold" href="#">Shareit</a>
  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarSupportedContent"
    aria-controls="navbarSupportedContent"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-3">

      <!-- Home -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/home" title="Home">
          <i class="bi bi-house fs-5"></i>
        </a>
      </li>

      <!-- Profile -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/profile" title="Profile">
          <i class="bi bi-person fs-5"></i>
        </a>
      </li>

      <!-- Notifications (replaces Saved Posts) -->
      <li class="nav-item position-relative">
        <a class="nav-link" routerLink="/notification" title="Notifications">
          <i class="bi bi-bell fs-5"></i>

          <!-- Badge -->
          <span
            *ngIf="unreadCount > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            {{ unreadCount }}
          </span>
        </a>
      </li>

      <!-- Admin Dashboard -->
      <li *ngIf="isAdmin | async" class="nav-item">
        <a class="nav-link" routerLink="/admin" title="Admin">
          <i class="bi bi-speedometer2 fs-5"></i>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" (click)="logout()" title="Logout">
          <i class="bi bi-box-arrow-right fs-5"></i>
        </a>
      </li>
    </ul>
  </div>

</div>
</nav>
